name: Website

# Rebuild the GitHub Pages site from README.md and documentation/ and publish
# it to the gh-pages branch. The build fails on a broken internal link.
on:
  push:
    branches: [master]
    paths:
      - README.md
      - documentation/**
      - site/**
      - mdship/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mdship
        run: pip install -e . pygments
      - name: Build site
        run: python site/build.py --out _site
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build website from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
